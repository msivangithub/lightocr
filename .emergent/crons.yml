crons:
  - name: docai-daily-digest
    description: "Sends daily DocAI scan summary email (docs scanned + Sarvam credits) at 9:30am IST"
    cron: "30 9 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
