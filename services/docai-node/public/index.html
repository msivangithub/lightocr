<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetailCLIQ · AI Document Wizard</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1a2233;--muted:#5f6b7f;--line:#e2e7ef;--brand:#0f5fd6;--brand-2:#0b4bb0;--ok:#138a4b;--warn:#c47a00;--err:#c62828;--new:#6a3fd6;--soft:#eef3fb;--radius:12px;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;min-height:100vh}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.3px}.logo b{color:var(--brand)}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--brand-2);border:1px solid #d6e2f7}
.chip.mock{background:#fff4e0;color:#8a5200;border-color:#f3d9a8}.chip.live{background:#e5f6ec;color:#0f6b3a;border-color:#b9e4c9}
.spacer{flex:1}
.stepper{display:flex;gap:4px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:thin}
.step{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.step .n{width:22px;height:22px;border-radius:50%;background:#e8ecf3;color:var(--muted);display:grid;place-items:center;font-size:11px}
.step.done .n{background:var(--ok);color:#fff}.step.done{color:var(--ok)}
.step.active{background:var(--soft);color:var(--brand-2);border-color:#cfdcf5}.step.active .n{background:var(--brand);color:#fff}
.step .arrow{color:#c4ccd8;margin-left:4px}
main{flex:1;padding:16px;max-width:1400px;width:100%;margin:0 auto;min-width:0;overflow-x:hidden}.card{min-width:0;max-width:100%}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}.sub{color:var(--muted);margin:0 0 14px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:600;color:var(--ink)}
.btn:hover{background:#f7f9fc}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.sm{padding:5px 9px;font-size:12px}.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.footer{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.src{border:1.5px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;background:#fff;transition:.15s}
.src:hover,.src.active{border-color:var(--brand);background:var(--soft)}.src .ic{font-size:26px}.src .t{font-weight:600;margin-top:6px}.src .d{font-size:11px;color:var(--muted)}
.drop{border:2px dashed #c9d4e6;border-radius:12px;padding:34px 16px;text-align:center;color:var(--muted);background:#fbfcfe}
.drop.over{border-color:var(--brand);background:var(--soft)}
textarea.big{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
.field input.changed{border-color:var(--warn);background:#fff9ec}
.detect{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:18px;border-radius:12px;background:linear-gradient(135deg,#eef3fb,#f8fafd);border:1px solid #d6e2f7}
.detect .big{font-size:22px;font-weight:800;color:var(--brand-2)}
.conf{display:inline-flex;align-items:center;gap:8px}.bar{width:120px;height:8px;background:#e3e9f3;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.review>div,.grid>*{min-width:0}.review{display:grid;grid-template-columns:minmax(280px,1fr) minmax(0,1.3fr);gap:14px}
@media(max-width:1000px){.review{grid-template-columns:1fr}}
.preview{background:#f2f4f8;border-radius:10px;min-height:360px;max-height:70vh;overflow:auto;border:1px solid var(--line)}
.preview iframe,.preview img{width:100%;border:0;min-height:360px;display:block}
.preview pre{white-space:pre-wrap;padding:12px;margin:0;font-size:12px;font-family:ui-monospace,Consolas,monospace}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tab{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600}.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{background:#f7f9fc;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
td input{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px;width:100%;min-width:70px}td input:focus{border-color:var(--brand);background:#fff;outline:0}
td input.changed{background:#fff9ec;border-color:#f3d9a8}
td.num,th.num{text-align:right}td.num input{text-align:right}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.b-ok{background:#e5f6ec;color:var(--ok)}.b-warn{background:#fff4e0;color:var(--warn)}.b-err{background:#fdecec;color:var(--err)}.b-new{background:#efe9fb;color:var(--new)}.b-info{background:var(--soft);color:var(--brand-2)}.b-muted{background:#eef1f5;color:var(--muted)}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.stat .s{padding:10px 14px;border-radius:10px;background:#f7f9fc;border:1px solid var(--line);min-width:110px}.stat .s b{display:block;font-size:20px}
.map-row td{white-space:normal}.map-row select{max-width:280px}
.actions{display:flex;gap:4px;flex-wrap:wrap}.actions .btn.sm.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.issue{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;border:1px solid var(--line);margin-bottom:6px}
.rel{display:flex;flex-direction:column;gap:8px}.rel label{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.rel label.on{border-color:var(--brand);background:var(--soft)}
.plan{display:grid;gap:8px}.plan .tx{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe}
.result-hero{text-align:center;padding:26px 10px}.result-hero .big{font-size:40px}.result-hero h1{margin-top:6px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;font-size:13px;word-break:break-word}.kv b{color:var(--muted);font-weight:600}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1a2233;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:50;max-width:90vw}
.toast.err{background:var(--err)}
.busy{display:flex;align-items:center;gap:12px;padding:16px;border-radius:10px;background:var(--soft);border:1px solid #d6e2f7;margin:10px 0}
.spin{width:18px;height:18px;border:3px solid #cfdcf5;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.audit{font-size:12px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px}.audit div{padding:6px 10px;border-bottom:1px solid var(--line)}.audit code{color:var(--muted)}
.hist{font-size:12px}.hist tr{cursor:pointer}.hist tr:hover td{background:#f7f9fc}
.hide{display:none!important}
.help{font-size:12px;color:var(--muted)}
.cam{width:100%;max-height:50vh;border-radius:10px;background:#000}
@media(max-width:600px){main{padding:10px}.card{padding:12px}.btn{padding:9px 11px}.kv{grid-template-columns:1fr}}

/* ---- Inbox / bulk intake ---- */
.inbox-top{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.inbox-top .field{min-width:150px}
.prog{height:8px;background:#e3e9f3;border-radius:6px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--brand);transition:width .3s}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.doc{border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;gap:10px;padding:10px;min-width:0}
.doc .th{width:84px;height:110px;flex:0 0 auto;border-radius:8px;background:#eef1f5 center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:22px}
.doc .body{flex:1;min-width:0}.doc .fn{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .party{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.doc .meta{font-size:12px;color:var(--muted)}
.doc .acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.doc.ready{border-color:#b9e4c9}.doc.needs-review{border-color:#f3d9a8}.doc.failed{border-color:#f5b5b5}.doc.posted{border-color:var(--ok);background:#f3fbf6}
.unit-row{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:#fff;border-radius:14px;max-width:1100px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:var(--shadow)}
.engine{font-size:11px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">Retail<b>CLIQ</b> &nbsp;·&nbsp; AI Document Wizard</div>
    <span id="modeChip" class="chip">…</span>
    <span id="batchChip" class="chip hide"></span>
    <div class="spacer"></div>
    <button class="btn sm" id="btnInbox" onclick="UI.inbox()">📥 Inbox / Bulk intake</button>
    <button class="btn sm" onclick="UI.showHistory()">Batches</button>
    <button class="btn sm primary" onclick="UI.reset()">+ New</button>
  </header>
  <nav class="stepper" id="stepper"></nav>
  <main id="main"></main>
</div>

<script>
/* ============================================================ state & api */
const STEPS=['SOURCE','DETECT','EXTRACT','REVIEW','MAP','VALIDATE','CONVERT','RECONCILE','POST','RESULT'];
const API='/api/docai';
const S={step:0,batch:null,types:[],type:null,source:{kind:'file',file:null,text:''},health:null,busy:null,reviewTab:'preview',typedDirty:{},history:[]};
async function api(path,opt={}){const r=await fetch(API+path,{headers:opt.body&&!(opt.body instanceof FormData)?{'Content-Type':'application/json'}:{},...opt,body:opt.body instanceof FormData?opt.body:opt.body?JSON.stringify(opt.body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j;}
const $=(s)=>document.querySelector(s);const esc=(s)=>String(s??'').replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=(n)=>n==null?'':Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),err?5000:2600);}
function busy(msg){S.busy=msg;render();}

/* ============================================================ render shell */
function renderStepper(){$('#stepper').innerHTML=STEPS.map((s,i)=>`<div class="step ${i<S.step?'done':i===S.step?'active':''}" ${i<S.step&&S.batch?`onclick="UI.goto(${i})"`:''}><span class="n">${i<S.step?'✓':i+1}</span>${s}${i<STEPS.length-1?'<span class="arrow">›</span>':''}</div>`).join('');
  $('#batchChip').classList.toggle('hide',!S.batch);if(S.batch)$('#batchChip').textContent='Batch '+S.batch.id.slice(0,8);}
function render(){if(S.step<0){$('#main').innerHTML=S.inbox.erp&&!S.inbox.job?VIEWS.ERP():VIEWS.INBOX();return;}renderStepper();const v=VIEWS[STEPS[S.step]];$('#main').innerHTML=(S.busy?`<div class="busy"><div class="spin"></div><div>${esc(S.busy)}</div></div>`:'')+v();}

/* ============================================================ views */
const VIEWS={};
VIEWS.SOURCE=()=>`<div class="card"><h1>What do you want to process?</h1><p class="sub">Upload or capture any business document — AI will identify the document type automatically.</p>
 <div class="src-grid">${[['file','📄','Upload file','PDF · Scan · Image · Excel · CSV'],['camera','📷','Camera capture','Photo a bill or challan'],['text','📋','Paste text','Copied email / message'],['manual','⌨️','Manual entry','Type the document'],['api','🔌','API / External ERP','JSON payload'],['bulk','📥','Bulk intake','Many files · ZIP/RAR · multi-page scans']].map(([k,ic,t,d])=>`<div class="src ${S.source.kind===k?'active':''}" onclick="UI.srcKind('${k}')"><div class="ic">${ic}</div><div class="t">${t}</div><div class="d">${d}</div></div>`).join('')}</div>
 <div style="margin-top:16px">${srcBody()}</div>
 <div class="footer"><span class="help"><button class="btn sm" onclick="UI.diag()">🩺 Check setup</button> ${S.health?`Engine: ${S.health.mock?'Mock (offline demo)':'Sarvam AI · '+S.health.mode} · DB: ${S.health.db?'connected':'in-memory'}`:''}</span><button class="btn primary" id="goDetect" onclick="UI.submitSource()" ${canSubmit()?'':'disabled'}>Identify document →</button></div></div>
 ${S.history.length?`<div class="card" style="margin-top:14px"><h2>Recent batches</h2>${historyTable()}</div>`:''}`;
function srcBody(){const k=S.source.kind;
 if(k==='bulk'){setTimeout(()=>UI.inbox(),0);return'';}
 if(k==='file')return`<div class="drop" id="drop" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="UI.drop(event)" onclick="$('#fileInp').click()"><div style="font-size:30px">⬆️</div><div><b>Drop a document here</b> or click to browse</div><div class="help">PDF, scanned PDF, JPG/PNG, XLSX, CSV, ZIP (≤10 pages / images, 200 MB)</div>${S.source.file?`<div style="margin-top:10px"><span class="badge b-ok">${esc(S.source.file.name)} · ${(S.source.file.size/1024).toFixed(0)} KB</span></div>`:''}</div><input id="fileInp" type="file" class="hide" accept=".pdf,.png,.jpg,.jpeg,.webp,.xlsx,.xls,.csv,.tsv,.txt,.zip" onchange="UI.pick(this.files[0])">
  <div class="grid g3" style="margin-top:10px"><div class="field"><label>Document content</label><select id="contentType"><option value="printed">Printed</option><option value="mixed">Mixed (printed + handwritten)</option><option value="handwritten">Handwritten</option></select></div><div class="field"><label>Language hint</label><select id="lang"><option>en-IN</option><option>hi-IN</option><option>te-IN</option><option>ta-IN</option><option>kn-IN</option><option>ml-IN</option><option>mr-IN</option><option>gu-IN</option><option>bn-IN</option></select></div></div>`;
 if(k==='camera')return`<video id="cam" class="cam" autoplay playsinline></video><canvas id="camCanvas" class="hide"></canvas><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="UI.camStart()">Start camera</button><button class="btn primary" onclick="UI.camShot()">Capture</button></div>${S.source.file?`<div style="margin-top:8px"><span class="badge b-ok">Captured ${esc(S.source.file.name)}</span></div>`:''}`;
 if(k==='text')return`<textarea class="big" placeholder="Paste invoice / PO / voucher text here…" oninput="S.source.text=this.value;$('#goDetect').disabled=!canSubmit()">${esc(S.source.text)}</textarea>`;
 if(k==='manual')return`<div class="grid g2"><div class="field"><label>Document type</label><select id="manualType">${S.types.map(t=>`<option value="${t.code}">${t.name}</option>`).join('')}</select></div><div class="field"><label>Party</label><input id="mParty" placeholder="Supplier / customer name"></div><div class="field"><label>Document No</label><input id="mNo"></div><div class="field"><label>Date</label><input id="mDate" type="date"></div></div><div class="field" style="margin-top:10px"><label>Lines (one per line: description, qty, uom, rate, tax%)</label><textarea class="big" id="mLines" placeholder="Basmati Rice 5kg, 40, PCS, 410, 5"></textarea></div><p class="help">Manual entry is converted into a typed document and goes through the same validation & posting path.</p>`;
 if(k==='api')return`<textarea class="big" placeholder='{"documentType":"PI","header":{...},"lines":[...]}  — or any JSON from an external ERP' oninput="S.source.text=this.value;$('#goDetect').disabled=!canSubmit()">${esc(S.source.text)}</textarea><p class="help">External systems can also call <code>POST ${API}/batches</code> directly with <code>payload</code>.</p>`;}
function canSubmit(){const k=S.source.kind;return (k==='file'||k==='camera')?!!S.source.file:k==='manual'?true:!!S.source.text.trim();}
function historyTable(){return`<div class="tbl-wrap"><table class="hist"><thead><tr><th>Batch</th><th>Type</th><th>Doc No</th><th>Party</th><th class="num">Total</th><th>Status</th><th>Created</th></tr></thead><tbody>${S.history.map(b=>`<tr onclick="UI.open('${b.id}')"><td>${b.id.slice(0,8)}</td><td>${esc(b.docType||'—')}</td><td>${esc(b.docNo||'')}</td><td>${esc(b.party||'')}</td><td class="num">${money(b.grandTotal)}</td><td><span class="badge ${b.status==='posted'?'b-ok':b.status==='pending-approval'?'b-warn':'b-muted'}">${b.status}</span></td><td>${new Date(b.createdAt).toLocaleString('en-IN')}</td></tr>`).join('')}</tbody></table></div>`;}

function progressCard(title){const p=S.progress||{};const log=(p.log||[]).slice(-12);return`<div class="card"><h1>${title}</h1><p class="sub">${esc(p.message||'Working…')}</p><div class="prog"><i style="width:${p.done?100:p.error?100:Math.min(90,10+(p.log?.length||0)*6)}%;${p.error?'background:var(--err)':''}"></i></div><div class="audit">${log.map(l=>`<div><code>${new Date(l.at).toLocaleTimeString('en-IN')}</code> <span class="badge b-info">${esc(l.stage||'')}</span> ${esc(l.message||'')}</div>`).join('')||'<div class="help" style="padding:8px">Waiting for the server…</div>'}</div><div class="footer"><span class="help">Started ${p.startedAt?new Date(p.startedAt).toLocaleTimeString('en-IN'):''} · Sarvam OCR jobs take 10–90 s; large scans longer.</span><button class="btn" onclick="UI.cancelWait()">Cancel</button></div></div>`;}
function errorCard(title,e){return`<div class="card"><h1 style="color:var(--err)">${title} failed</h1><div class="issue"><span class="badge b-err">error</span><div><b>${esc(e.message)}</b>${e.detail?`<div class="help" style="margin-top:4px;white-space:pre-wrap">${esc(e.detail)}</div>`:''}</div></div>${(e.log||[]).length?`<details><summary class="help">Progress log (${e.log.length})</summary><div class="audit">${e.log.map(l=>`<div><code>${new Date(l.at).toLocaleTimeString('en-IN')}</code> ${esc(l.message)}</div>`).join('')}</div></details>`:''}<p class="help" style="margin-top:10px">Common causes: wrong/expired SARVAM_API_KEY, Sarvam Document AI not enabled on the key, no outbound internet from the server, PDF over 200 MB, or (local engine) tesseract/poppler missing. <b>Check setup</b> tests each of these.</p><div class="footer"><div style="display:flex;gap:8px"><button class="btn" onclick="UI.reset()">← Start over</button><button class="btn" onclick="UI.diag()">🩺 Check setup</button></div><div style="display:flex;gap:8px">${e.retry?`<button class="btn primary" onclick="${e.retry}">Retry</button>`:''}</div></div></div>`;}
VIEWS.DETECT=()=>{if(S.err&&S.err.step==='detect')return errorCard('Identify document',S.err);const d=S.batch?.detection;if(!d)return progressCard('Reading & identifying document…');const t=S.types.find(x=>x.code===S.batch.docType);const pct=Math.round((d.confidence||0)*100);
 return`<div class="card"><h1>Document identified</h1><p class="sub">AI reading result — accept it or change the document type before processing continues.</p>
 <div class="detect"><div><div class="help">DETECTED TYPE</div><div class="big">${esc(t?.name||S.batch.docType)}</div><div class="help">${esc((d.reasons||[]).join(' · '))}</div></div><div class="conf"><div class="bar"><i style="width:${pct}%;background:${pct>=85?'var(--ok)':pct>=60?'var(--warn)':'var(--err)'}"></i></div><b>Confidence ${pct}%</b></div></div>
 <div class="grid g2" style="margin-top:14px"><div class="field"><label>Change document type</label><select id="typeSel" onchange="UI.changeType(this.value)">${S.types.map(x=>`<option value="${x.code}" ${x.code===S.batch.docType?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="field"><label>Alternatives</label><div>${(d.alternatives||[]).map(a=>`<span class="badge b-info" style="margin-right:4px;cursor:pointer" onclick="UI.changeType('${a.documentType}')">${esc(S.types.find(x=>x.code===a.documentType)?.name||a.documentType)} ${Math.round(a.confidence*100)}%</span>`).join('')||'—'}</div></div></div>
 ${S.batch.rawText?`<details style="margin-top:12px"><summary class="help">Show OCR / source text (${S.batch.rawText.length} chars${S.batch.ocrUsage?`, ${S.batch.ocrUsage.pages_total} page(s) via Sarvam`:''})</summary><pre style="white-space:pre-wrap;font-size:12px;background:#f7f9fc;padding:10px;border-radius:8px;max-height:260px;overflow:auto">${esc(S.batch.rawText.slice(0,6000))}</pre></details>`:''}
 <div class="footer"><button class="btn" onclick="UI.reset()">Cancel</button><div style="display:flex;gap:8px"><button class="btn" onclick="UI.goto(0)">← Back</button><button class="btn primary" onclick="UI.extract()">Accept & extract →</button></div></div></div>`;};

VIEWS.EXTRACT=()=>{if(S.err&&S.err.step==='extract')return errorCard('Extraction',S.err);return progressCard('AI document reading & extraction');};
VIEWS._EXTRACT_OLD=()=>`<div class="card"><h1>AI document reading & extraction</h1><p class="sub">Sarvam reads the document; RetailCLIQ structures header, line items, taxes and totals.</p><div class="grid g4">${['OCR / text','Header fields','Line items / table','Totals & taxes'].map((x,i)=>`<div class="stat"><div class="s" style="width:100%"><b>${S.busy?'⏳':'✓'}</b>${x}</div></div>`).join('')}</div></div>`;

VIEWS.REVIEW=()=>{const b=S.batch,t=S.type;if(!b||!t)return'';const hf=t.headerFields;const lf=t.lineFields.filter(f=>f.key!=='lineNo');const iss=(b.validation?.issues||[]).filter(i=>i.level!=='info');const lv={error:'b-err',warning:'b-warn','new-master':'b-new'};
 return`<div class="card"><h1>Extraction review</h1><p class="sub">Left: original document. Right: extracted data — edit anything before continuing (edits are audited and used for format learning).</p>
 <div class="review"><div><div class="tabs"><button class="tab ${S.reviewTab==='preview'?'on':''}" onclick="S.reviewTab='preview';render()">Original</button><button class="tab ${S.reviewTab==='text'?'on':''}" onclick="S.reviewTab='text';render()">OCR text</button><button class="tab ${S.reviewTab==='json'?'on':''}" onclick="S.reviewTab='json';render()">AI JSON</button></div><div class="preview">${previewBody()}</div></div>
 <div><h2>Header <button class="btn sm ghost" onclick="S.allHeader=!S.allHeader;render()">${S.allHeader?'Show filled only':'Show all '+hf.length+' fields'}</button></h2><div class="grid g3">${hf.filter(f=>S.allHeader||f.required||(b.header[f.key]!=null&&b.header[f.key]!=='')||['party','partyGstin','docNo','docDate','refNo','subTotal','cgst','sgst','igst','grandTotal'].includes(f.key)).map(f=>`<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><input data-h="${f.key}" type="${f.type==='date'?'date':'text'}" value="${esc(b.header[f.key]??'')}" oninput="UI.editH('${f.key}',this)" ${f.type==='money'||f.type==='number'?'inputmode="decimal"':''}></div>`).join('')}</div>
 ${iss.length?`<details style="margin-top:10px" ${iss.some(i=>i.level==='error')?'open':''}><summary><b>${iss.length} item(s) to fix before posting</b> · ${iss.filter(i=>i.level==='error').length} errors, ${iss.filter(i=>i.level==='warning').length} warnings, ${iss.filter(i=>i.level==='new-master').length} unmapped masters</summary>${iss.slice(0,40).map(i=>`<div class="issue" style="padding:4px 8px;margin:4px 0"><span class="badge ${lv[i.level]}">${i.level}</span><div>${i.line?'Line '+i.line+' · ':''}<b>${esc(i.field||i.scope)}</b> — ${esc(i.message)}</div></div>`).join('')}</details>`:''}
 <h2 style="margin-top:14px">Line items <span class="badge b-muted">${b.lines.length}</span> <button class="btn sm" onclick="UI.addLine()">+ Add line</button></h2>
 <div class="tbl-wrap"><table><thead><tr><th>#</th>${lf.map(f=>`<th class="${isNum(f)?'num':''}">${esc(f.label)}</th>`).join('')}<th></th></tr></thead><tbody>${b.lines.map((l,i)=>`<tr><td>${i+1}</td>${lf.map(f=>`<td class="${isNum(f)?'num':''}"><input type="${f.type==='date'?'date':'text'}" value="${esc(l[f.key]??'')}" oninput="UI.editL(${i},'${f.key}',this)" ${iss.some(x=>x.line===i+1&&x.field===f.key)?'style="border-color:var(--err);background:#fdecec"':''}></td>`).join('')}<td><button class="btn sm ghost" onclick="UI.delLine(${i})">✕</button></td></tr>`).join('')}</tbody>
 ${t.category!=='accounting'?`<tfoot><tr><th colspan="${lf.length-1}" class="num">Σ Lines</th><th class="num">${money(sum(b.lines,'amount'))}</th><th></th></tr></tfoot>`:`<tfoot><tr><th colspan="${lf.length-2}" class="num">Totals</th><th class="num">${money(sum(b.lines,'debit'))}</th><th class="num">${money(sum(b.lines,'credit'))}</th><th></th></tr></tfoot>`}</table></div></div></div>
 <div class="footer"><span class="help">${b.corrections.length} correction(s) recorded</span><div style="display:flex;gap:8px"><button class="btn" onclick="UI.goto(1)">← Back</button><button class="btn" onclick="UI.erpPreview(S.batch.id)">→ RetailCLIQ screen payload</button><button class="btn primary" onclick="UI.saveReview()">Save & map masters →</button></div></div></div>`;};
const isNum=(f)=>['number','money','int'].includes(f.type);const sum=(a,k)=>a.reduce((s,l)=>s+(Number(l[k])||0),0);
function previewBody(){const b=S.batch;if(S.reviewTab==='text')return`<pre>${esc(b.rawText||'(no text)')}</pre>`;if(S.reviewTab==='json')return`<pre>${esc(JSON.stringify(b.extraction?.raw,null,2))}</pre>`;
 const f=b.source?.fileName||'';if(b.source?.pageImages?.length)return b.source.pageImages.map(p=>`<img src="${API}/intake/file?p=${encodeURIComponent(p)}" style="margin-bottom:6px">`).join('');if(!b.source?.path)return`<pre>${esc(b.source?.text||b.rawText||'')}</pre>`;if(/\.pdf$/i.test(f))return`<iframe src="${API}/batches/${b.id}/file#toolbar=0"></iframe>`;if(/\.(png|jpe?g|webp)$/i.test(f))return`<img src="${API}/batches/${b.id}/file">`;return`<pre>${esc(b.rawText||'')}</pre>`;}

VIEWS.MAP=()=>{const items=S.batch?.mapItems||[];const grp={};items.forEach(i=>(grp[i.master]=grp[i.master]||[]).push(i));const unres=items.filter(i=>!i.selected&&!['skipped','later'].includes(i.status)).length;
 return`<div class="card"><h1>Master identification & mapping</h1><p class="sub">Every supplier, item, UOM, tax, warehouse and account in the document must resolve to a RetailCLIQ master.</p>
 <div class="stat"><div class="s"><b>${items.length}</b>references</div><div class="s"><b style="color:var(--ok)">${items.filter(i=>i.status==='auto'||i.status==='mapped'||i.status==='created').length}</b>resolved</div><div class="s"><b style="color:var(--new)">${unres}</b>unresolved</div></div>
 ${Object.entries(grp).map(([m,arr])=>`<h2 style="text-transform:capitalize">${m} <span class="badge b-muted">${arr.length}</span></h2><div class="tbl-wrap" style="margin-bottom:14px"><table><thead><tr><th>Where</th><th>Document value</th><th>RetailCLIQ master</th><th>Status</th><th>Action</th></tr></thead><tbody>${arr.map(it=>mapRow(it)).join('')}</tbody></table></div>`).join('')}
 <div class="footer"><span class="help">Actions: Map existing · Create new · Skip · Review later</span><div style="display:flex;gap:8px"><button class="btn" onclick="UI.goto(3)">← Back</button><button class="btn primary" onclick="UI.applyMap()">Apply & validate →</button></div></div></div>`;};
function mapRow(it){const sel=it.selected||'';const st=it.status;const badge=st==='auto'?'b-ok':st==='mapped'||st==='created'?'b-ok':st==='suggested'?'b-warn':st==='skipped'||st==='later'?'b-muted':'b-new';
 return`<tr class="map-row" id="map-${CSS.escape(it.id)}"><td class="help">${it.scope==='header'?'Header':'Line '+it.line}</td><td><b>${esc(it.value)}</b></td><td><select onchange="UI.mapSel('${it.id}',this.value)"><option value="">— choose —</option>${(it.candidates||[]).map(c=>`<option value="${esc(c.code)}" ${c.code===sel?'selected':''}>${esc(c.name)} (${esc(c.code)}) · ${Math.round(c.score*100)}%</option>`).join('')}</select> <button class="btn sm" onclick="UI.mapSearch('${it.id}','${esc(it.master)}')">🔍</button></td><td><span class="badge ${badge}">${st}</span></td><td class="actions">${[['map','Map'],['create','Create new'],['skip','Skip'],['later','Later']].map(([a,l])=>`<button class="btn sm ${it.action===a?'on':''}" onclick="UI.mapAct('${it.id}','${a}')">${l}</button>`).join('')}</td></tr>`;}

VIEWS.VALIDATE=()=>{const v=S.batch?.validation;if(!v)return'';const lv={error:'b-err',warning:'b-warn','new-master':'b-new',info:'b-info'};
 return`<div class="card"><h1>Field & row-wise validation</h1><p class="sub">Valid → continue · Warning → continue after review · Error → correction required · New Master → mapping needed.</p>
 <div class="stat"><div class="s"><b style="color:var(--err)">${v.summary.errors}</b>Errors</div><div class="s"><b style="color:var(--warn)">${v.summary.warnings}</b>Warnings</div><div class="s"><b style="color:var(--new)">${v.summary.newMasters}</b>New masters</div><div class="s"><b style="color:var(--ok)">${S.batch.lines.length-new Set(v.issues.filter(i=>i.level==='error'&&i.line).map(i=>i.line)).size}</b>Valid lines</div></div>
 ${v.issues.length?v.issues.map(i=>`<div class="issue"><span class="badge ${lv[i.level]}">${i.level}</span><div><b>${i.line?'Line '+i.line+' · ':''}${esc(i.field||i.scope)}</b> — ${esc(i.message)}</div></div>`).join(''):`<div class="issue"><span class="badge b-ok">valid</span><div>All checks passed.</div></div>`}
 <div class="footer"><div style="display:flex;gap:8px"><button class="btn" onclick="UI.goto(3)">Fix in review</button><button class="btn" onclick="UI.goto(4)">Fix mappings</button></div><div style="display:flex;gap:8px"><button class="btn" onclick="UI.revalidate()">Re-validate</button><button class="btn primary" onclick="UI.relationships()" ${v.canContinue?'':'disabled'}>Continue →</button></div></div></div>`;};

VIEWS.CONVERT=()=>{const o=S.batch?.relationshipOptions||[];const r=S.batch?.relationship||{};
 return`<div class="card"><h1>Document relationship & conversion</h1><p class="sub">Decide whether this document stands alone, links against an existing RetailCLIQ document, or should also create follow-on documents.</p>
 <div class="rel">${o.map(op=>`<label class="${r.mode===op.mode&&r.target===op.target?'on':''}"><input type="radio" name="rel" ${r.mode===op.mode&&r.target===op.target?'checked':''} onchange="UI.setRel('${op.mode}','${op.target}')"><div><b>${esc(op.label)}</b>${op.mode==='against'?`<div class="help">${op.candidates.length?`Candidates: `+op.candidates.map(c=>`<span class="badge ${c.match==='reference'?'b-ok':'b-muted'}" style="margin:2px;cursor:pointer" onclick="event.preventDefault();UI.setRel('against','${op.target}','${c.docNo}')">${esc(c.docNo)} · ${esc(c.sourceDocNo||'')} · ₹${money(c.total)}</span>`).join(''):'No posted '+op.target+' found for this party — you can still post standalone.'}</div>`:op.mode==='creates'?`<div class="help">Chain: ${esc(S.type.name)} → ${esc(S.types.find(t=>t.code===op.target)?.name)}</div>`:''}</div></label>`).join('')}</div>
 ${r.mode==='against'?`<p class="help" style="margin-top:8px">Linked document: <b>${esc(r.linkedDocNo||'none selected')}</b></p>`:''}
 <div class="footer"><button class="btn" onclick="UI.goto(5)">← Back</button><button class="btn primary" onclick="UI.reconcile()">Reconcile →</button></div></div>`;};

VIEWS.RECONCILE=()=>{const r=S.batch?.reconciliation;if(!r)return'';
 return`<div class="card"><h1>Reconciliation</h1><p class="sub">Totals and related documents are reconciled before posting. Critical mismatches block posting until resolved or explicitly overridden.</p>
 <div class="tbl-wrap"><table><thead><tr><th>Check</th><th class="num">Expected</th><th class="num">Actual</th><th class="num">Diff</th><th>Status</th><th></th></tr></thead><tbody>${r.checks.map(c=>`<tr><td style="white-space:normal">${esc(c.label)}${c.info?`<div class="help">${esc(c.info)}</div>`:''}${c.overridden?`<div class="help">Overridden: ${esc(c.reason)}</div>`:''}</td><td class="num">${money(c.expected)}</td><td class="num">${money(c.actual)}</td><td class="num" style="color:${Math.abs(c.diff)>0?'var(--err)':'inherit'}">${money(c.diff)}</td><td><span class="badge ${c.ok?(c.overridden?'b-warn':'b-ok'):c.critical?'b-err':'b-warn'}">${c.ok?(c.overridden?'overridden':'ok'):c.critical?'mismatch':'warning'}</span></td><td>${!c.ok&&c.critical?`<button class="btn sm" onclick="UI.override('${c.key}')">Override</button>`:''}</td></tr>`).join('')}</tbody></table></div>
 <div class="footer"><button class="btn" onclick="UI.goto(3)">Fix values</button><div style="display:flex;gap:8px"><button class="btn" onclick="UI.reconcile()">Re-run</button><button class="btn primary" onclick="UI.plan()" ${r.canPost?'':'disabled'}>Review posting →</button></div></div></div>`;};

VIEWS.POST=()=>{const p=S.batch?.plan;if(!p)return'';const h=S.batch.header;
 return`<div class="card"><h1>Confirm & post</h1><p class="sub">These are the exact RetailCLIQ transactions that will be created.</p>
 <div class="grid g2"><div><h2>Document</h2><div class="kv"><b>Type</b><span>${esc(p.documentType)}</span><b>Party</b><span>${esc(p.summary.party||'—')}</span><b>Doc No / Date</b><span>${esc(p.summary.docNo)} · ${esc(p.summary.docDate||'')}</span><b>Lines</b><span>${p.summary.lines}</span><b>Grand total</b><span>₹${money(p.summary.grandTotal)}</span><b>Relationship</b><span>${esc(p.linked?.mode)}${p.linked?.linkedDocNo?' → '+esc(p.linked.linkedDocNo):''}</span><b>Impact</b><span>Inventory: ${p.inventoryImpact} · Accounting: ${p.accountingImpact} · Tax: ${p.taxImpact}</span></div></div>
 <div><h2>Transactions to be created</h2><div class="plan">${p.transactions.map((t,i)=>`<div class="tx"><span class="badge b-info">${i+1}</span>${esc(t.name)}</div>`).join('')}</div>${p.approvalRequired?`<div class="issue" style="margin-top:10px"><span class="badge b-warn">approval</span><div>Approval workflow applies — the document will be submitted for approval instead of posting directly.</div></div>`:''}</div></div>
 <div class="footer"><button class="btn" onclick="UI.goto(7)">← Back</button><div style="display:flex;gap:8px">${p.approvalRequired?`<button class="btn primary" onclick="UI.post(false)">Submit for approval</button><button class="btn ok" onclick="UI.post(true)">Approve & post (manager)</button>`:`<button class="btn ok" onclick="UI.post(false)">CONFIRM & POST</button>`}</div></div></div>`;};

VIEWS.RESULT=()=>{const r=S.batch?.result;if(!r)return'';const b=S.batch;const ok=r.status==='posted';
 return`<div class="card"><div class="result-hero"><div class="big">${ok?'✅':'🕒'}</div><h1>${ok?'Posted successfully':'Submitted for approval'}</h1><p class="sub">${ok?`Created <b>${esc(r.createdDocNo)}</b>`:esc(r.message)}</p></div>
 <div class="grid g2"><div><h2>Result</h2><div class="kv"><b>Batch ID</b><span>${b.id}</span><b>Document</b><span>${esc(r.createdDocNo||'—')}</span><b>Posting</b><span>${esc(r.postingStatus||r.status)}</span><b>Stock</b><span>${r.stockUpdated?'Updated':'No impact'}</span><b>Accounting</b><span>${r.accountingPosted?'Posted':'No impact'}</span><b>Tax</b><span>${r.taxPosted?'Posted':'No impact'}</span><b>Related</b><span>${(r.related||[]).join(', ')||'—'}</span><b>Source</b><span>${esc(b.source?.fileName||b.source?.kind)}</span><b>Corrections</b><span>${b.corrections.length}</span><b>Validation</b><span>${b.validation?`${b.validation.summary.errors} err · ${b.validation.summary.warnings} warn`:'—'}</span><b>User / time</b><span>${esc(b.user)} · ${new Date(r.postedAt||Date.now()).toLocaleString('en-IN')}</span></div></div>
 <div><h2>Audit trail</h2><div class="audit">${b.audit.map(a=>`<div><code>${new Date(a.at).toLocaleTimeString('en-IN')}</code> <b>${esc(a.event)}</b> <span class="help">${esc(JSON.stringify(a.detail))}</span></div>`).join('')}</div></div></div>
 <div class="footer"><button class="btn" onclick="UI.downloadAudit()">Download audit JSON</button><div style="display:flex;gap:8px"><button class="btn" onclick="UI.showHistory()">All batches</button><button class="btn primary" onclick="UI.reset()">Process another document</button></div></div></div>`;};

/* ============================================================ inbox view */
S.inbox={jobs:[],job:null,files:[],es:null,engine:null,erp:null};
VIEWS.INBOX=()=>{const I=S.inbox;const j=I.job;const docs=j?j.units.flatMap(u=>u.docs.map(d=>({...d,file:u.fileName}))):[];const done=j?j.units.filter(u=>['done','failed','skipped'].includes(u.status)).length:0;
 return`<div class="card"><h1>Inbox · bulk document intake</h1><p class="sub">Drop supplier invoices in any form — PDFs, scans, photos, ZIP/RAR, multi-invoice PDFs. Pages are split into documents, read by ${I.engine?(I.engine.ocr==='sarvam'?'Sarvam Document Intelligence':I.engine.ocr+' OCR'):'…'}, mapped to RetailCLIQ masters and validated; each document then waits here for review or posting.</p>
 <div class="inbox-top"><div class="field" style="flex:1;min-width:240px"><label>Files</label><div class="drop" style="padding:16px" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="UI.ibDrop(event)" onclick="$('#ibFiles').click()"><b>${I.files.length?I.files.length+' file(s) selected':'Drop files / ZIP / RAR here or click'}</b><div class="help">${I.files.slice(0,6).map(f=>esc(f.name)).join(', ')}${I.files.length>6?' …':''}</div></div><input id="ibFiles" type="file" multiple class="hide" accept=".pdf,.png,.jpg,.jpeg,.webp,.zip,.rar,.xlsx,.csv" onchange="UI.ibPick(this.files)"></div>
 <div class="field"><label>Page grouping</label><select id="ibSplit"><option value="auto">Auto (invoice no / page x of y)</option><option value="page">One document per page</option><option value="file">One document per file</option></select></div>
 <div class="field"><label>Content</label><select id="ibContent"><option value="mixed">Mixed (printed + handwritten)</option><option value="printed">Printed</option><option value="handwritten">Handwritten</option></select></div>
 <div class="field"><label>Rotate photos</label><select id="ibRotate"><option value="0">Auto (EXIF)</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></div>
 <div class="field"><label>Target screen</label><select id="ibScreen"><option value="PI">Purchase Invoice</option><option value="GRN_PO">GRN Against PO</option><option value="GRN_PI">GRN Against PI</option><option value="PIR">Purchase Invoice Return</option><option value="GRNR">GRN Return</option></select></div>
 <button class="btn primary" onclick="UI.ibStart()" ${I.files.length?'':'disabled'}>Start intake →</button></div>
 ${j?`<div style="margin-top:14px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><b>Job ${j.id.slice(0,8)} · ${j.status}</b><span class="help">${done}/${j.units.length} files · ${docs.length} documents · ${j.summary?.clean||0} clean · ${j.summary?.needsReview||0} need review · ${j.summary?.posted||0} posted</span></div><div class="prog"><i style="width:${j.units.length?Math.round(done/j.units.length*100):0}%"></i></div>
 <div class="stat"><div class="s"><b>${j.units.length}</b>files</div><div class="s"><b>${docs.length}</b>documents</div><div class="s"><b style="color:var(--ok)">${docs.filter(d=>d.status==='ready').length}</b>ready to post</div><div class="s"><b style="color:var(--warn)">${docs.filter(d=>d.status==='needs-review').length}</b>need review</div><div class="s"><b style="color:var(--err)">${docs.filter(d=>d.status==='failed').length+j.units.filter(u=>u.status==='failed').length}</b>failed</div></div>
 <div style="display:flex;gap:6px;flex-wrap:wrap"><a class="btn sm" href="${API}/intake/${j.id}/export.xlsx">⬇ Excel (documents + lines)</a><a class="btn sm" href="${API}/intake/${j.id}/export.json">⬇ JSON</a><button class="btn sm ok" onclick="UI.ibPostClean()" ${j.status==='done'?'':'disabled'}>Post all clean documents</button><button class="btn sm" onclick="UI.ibRefresh()">↻</button></div>
 <details style="margin-top:10px"><summary class="help">File progress (${j.units.length})</summary>${j.units.map(u=>`<div class="unit-row"><span class="badge ${u.status==='done'?'b-ok':u.status==='failed'?'b-err':u.status==='queued'?'b-muted':'b-info'}">${u.status}</span><b style="min-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.fileName)}</b><span class="help">${u.kind} · ${u.pages} page(s)</span><span class="help" style="flex:1">${esc(u.message||u.error||'')}</span></div>`).join('')}</details>
 <div class="doc-grid">${docs.map(d=>docCard(d)).join('')}</div></div>`:''}
 ${!j&&I.jobs.length?`<h2 style="margin-top:16px">Previous intake jobs</h2>${I.jobs.map(x=>`<div class="unit-row"><span class="badge ${x.status==='done'?'b-ok':'b-info'}">${x.status}</span><b>${x.id.slice(0,8)}</b><span class="help">${new Date(x.createdAt).toLocaleString('en-IN')} · ${x.units.length} files · ${x.summary?.docs??'-'} docs</span><button class="btn sm" onclick="UI.ibOpenJob('${x.id}')">Open</button></div>`).join('')}`:''}
 </div>`;};
function docCard(d){const v=d.validation;return`<div class="doc ${d.status}"><div class="th" style="${d.thumb?`background-image:url('${d.thumb}')`:''}">${d.thumb?'':'📄'}</div><div class="body"><div class="fn">${esc(d.file)} · p${d.pages.join(',')}</div><div class="party">${esc(d.party||'(supplier not read)')}</div><div class="meta">${esc(S.types.find(t=>t.code===d.docType)?.name||d.docType||'')} ${d.confidence!=null?Math.round(d.confidence*100)+'%':''} · ${esc(d.docNo||'no inv no')} · ${esc(d.docDate||'')}</div><div class="meta"><b>₹${money(d.grandTotal)}</b> · ${d.lines||0} lines</div>
 <div style="margin-top:4px">${d.status==='posted'?`<span class="badge b-ok">posted ${esc(d.createdDocNo||'')}</span>`:d.status==='failed'?`<span class="badge b-err">${esc(d.error||'failed')}</span>`:v?`<span class="badge ${v.errors?'b-err':'b-ok'}">${v.errors} err</span> <span class="badge b-warn">${v.warnings} warn</span> <span class="badge b-new">${v.newMasters} new</span>`:`<span class="badge b-info">${d.status}</span>`}</div>
 <div class="acts">${d.batchId?`<button class="btn sm primary" onclick="UI.open('${d.batchId}')">Open in wizard</button><button class="btn sm" onclick="UI.erpPreview('${d.batchId}')">→ ${esc($('#ibScreen')?.value||'PI')} screen</button>`:''}<button class="btn sm" onclick="UI.ibRotate('${d.id}')">↻ Rotate & redo</button></div></div></div>`;}
VIEWS.ERP=()=>{const e=S.inbox.erp;if(!e)return'';const cols=['oemCode','itemName','hsn','qty','uom','rate','mrp','disc','inTax','cgst','sgst','igst','amount','division','dept','category','subcatg','brand','style','size','color'];
 return`<div class="card"><h1>RetailCLIQ ${esc(e.header.screen)} payload</h1><p class="sub">Exactly what the Purchase Invoice / GRN screen receives (rows = import fields + grid columns; header = Document / Supplier / Bill / Tax / Amount sections; staging = Stock_Import_Export).</p>
 ${e.warnings.length?`<div class="issue"><span class="badge b-warn">${e.warnings.length} warnings</span><div>${e.warnings.slice(0,8).map(esc).join('<br>')}${e.warnings.length>8?'<br>…':''}</div></div>`:''}
 <div class="grid g2"><div><h2>Document information</h2><div class="kv"><b>Supplier</b><span>${esc(e.header.supplier)} ${e.header.supplierCode?'('+esc(e.header.supplierCode)+')':'<span class="badge b-new">new supplier</span>'}</span><b>GSTIN / St Code</b><span>${esc(e.header.gstin)} · ${esc(e.header.stCode)}</span><b>Invoice No / Date</b><span>${esc(e.header.invoiceNo)} · ${esc(e.header.invoiceDate)} (HBS ${e.header.invoiceDateHBS??'-'})</span><b>Invoice Ref / LR</b><span>${esc(e.header.invoiceRef)} · ${esc(e.header.lrRef)}</span><b>Pay mode / A/c</b><span>${esc(e.header.payMode)} · ${esc(e.header.purchaseAc)}</span><b>Transport / E-way</b><span>${esc(e.header.transporter)} · ${esc(e.header.ewayBillNo)}</span></div></div>
 <div><h2>Bill · tax · amounts</h2><div class="kv"><b>Gross</b><span>₹${money(e.header.grossAmount)}</span><b>Discount</b><span>₹${money(e.header.discount)} (${e.header.discPct}%)</span><b>CGST / SGST / IGST</b><span>₹${money(e.header.cgstAmt)} / ₹${money(e.header.sgstAmt)} / ₹${money(e.header.igstAmt)} ${e.header.interState?'<span class="badge b-info">inter-state</span>':''}</span><b>Freight / TCS / Round</b><span>₹${money(e.header.freight)} / ₹${money(e.header.tcs)} / ₹${money(e.header.roundOff)}</span><b>GST amount</b><span>₹${money(e.header.gstAmount)}</span><b>Net amount</b><span><b>₹${money(e.header.netAmount)}</b></span><b>Lines / Qty</b><span>${e.header.lineCount} / ${e.header.totalQty}</span></div></div></div>
 <h2 style="margin-top:12px">Item grid (${e.rows.length})</h2><div class="tbl-wrap"><table><thead><tr><th>#</th>${cols.map(c=>`<th>${c}</th>`).join('')}<th>matched</th></tr></thead><tbody>${e.rows.map((r,i)=>`<tr><td>${i+1}</td>${cols.map(c=>`<td class="${typeof r[c]==='number'?'num':''}">${esc(typeof r[c]==='number'?money(r[c]):r[c])}${c==='oemCode'&&r.oemCodeSynthesized?' <span class="badge b-warn">auto</span>':''}</td>`).join('')}<td>${r.matched?'<span class="badge b-ok">master</span>':'<span class="badge b-new">new item</span>'}</td></tr>`).join('')}</tbody></table></div>
 <div class="footer"><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="UI.erpDownload()">⬇ Download JSON</button><button class="btn" onclick="UI.erpCopy()">Copy JSON</button><button class="btn" onclick="UI.erpSend()">Send to open RetailCLIQ screen (postMessage)</button></div><div style="display:flex;gap:8px"><button class="btn" onclick="UI.inbox(true)">← Inbox</button><button class="btn primary" onclick="UI.open('${e.batchId}')">Review in wizard</button></div></div></div>`;};

/* ============================================================ actions */
const UI={
 async init(){try{S.health=await api('/health');S.types=await api('/doc-types');S.history=await api('/batches');}catch(e){toast('Server not reachable: '+e.message,true)}
  const c=$('#modeChip');if(S.health){c.textContent=S.health.mock?'MOCK MODE':(S.health.ocr==='sarvam'?'Sarvam AI · live':'OCR: '+S.health.ocr+' · LLM: '+S.health.llm);c.className='chip '+(S.health.mock?'mock':S.health.ocr==='sarvam'?'live':'');}render();},
 reset(){S.err=null;S.progress=null;S.waiting=false;S.step=0;S.batch=null;S.type=null;S.source={kind:'file',file:null,text:''};S.busy=null;UI.init();},
 goto(i){S.step=i;render();},
 srcKind(k){S.source.kind=k;S.source.file=null;render();if(k==='camera')setTimeout(UI.camStart,50);},
 pick(f){if(!f)return;S.source.file=f;render();},
 drop(e){e.preventDefault();UI.pick(e.dataTransfer.files[0]);},
 async camStart(){try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('#cam').srcObject=st;}catch(e){toast('Camera not available: '+e.message,true)}},
 camShot(){const v=$('#cam'),c=$('#camCanvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(b=>{S.source.file=new File([b],`capture-${Date.now()}.jpg`,{type:'image/jpeg'});(v.srcObject?.getTracks()||[]).forEach(t=>t.stop());render();},'image/jpeg',.92);},
 async submitSource(){try{const k=S.source.kind;let body;
   if(k==='file'||k==='camera'){body=new FormData();body.append('file',S.source.file);body.append('kind',k);body.append('contentType',$('#contentType')?.value||'mixed');}
   else if(k==='manual'){const lines=($('#mLines').value||'').split('\n').filter(Boolean).map((l,i)=>{const[description,qty,uom,rate,taxPct]=l.split(',').map(s=>s.trim());return{lineNo:i+1,description,qty:+qty,uom,rate:+rate,taxPct:+taxPct||0,amount:+qty*+rate};});
     body={kind:'manual',fileName:'manual-'+$('#manualType').value,payload:{documentType:$('#manualType').value,header:{party:$('#mParty').value,docNo:$('#mNo').value,docDate:$('#mDate').value,grandTotal:lines.reduce((s,l)=>s+l.amount*(1+l.taxPct/100),0)},lines}};}
   else if(k==='api')body={kind:'api',payload:S.source.text};else body={kind:'text',text:S.source.text};
   S.err=null;busy('Uploading source…');S.batch=await api('/batches',{method:'POST',body});S.busy=null;await UI.runDetect();}catch(e){S.busy=null;S.err={step:'detect',message:e.message,retry:'UI.submitSource()'};S.step=1;render();}},
 async runDetect(retry){S.err=null;S.step=1;S.progress={log:[],message:'Starting…'};render();
   try{await api(`/batches/${S.batch.id}/detect`,{method:'POST',body:{retry:!!retry}});const pr=await UI.waitStep('detect');if(!pr)return;
     const full=await api(`/batches/${S.batch.id}`);S.batch=full;S.type=S.types.find(t=>t.code===S.batch.docType);S.progress=null;render();}
   catch(e){S.progress=null;S.err={step:'detect',message:e.message,retry:'UI.runDetect(true)'};render();}},
 async waitStep(step){S.waiting=true;for(;;){if(!S.waiting)return null;await new Promise(r=>setTimeout(r,1500));let pr;try{pr=await api(`/batches/${S.batch.id}/progress`);}catch(e){continue;}S.progress=pr;if(pr.error){S.waiting=false;S.progress=null;S.err={step,message:pr.error,detail:pr.errorDetail,log:pr.log,retry:step==='detect'?'UI.runDetect(true)':'UI.extract()'};render();return null;}if(pr.done&&!pr.running){S.waiting=false;return pr;}if(S.step>=0)render();}},
 cancelWait(){S.waiting=false;S.progress=null;S.err={step:S.step===2?'extract':'detect',message:'Cancelled by user (the server may still finish in the background — reopen the batch from Batches).',retry:S.step===2?'UI.extract()':'UI.runDetect(true)'};render();},
 async diag(){busy('Checking setup (key, Sarvam, binaries)…');let d;try{d=await api('/diag');}catch(e){d={error:e.message};}S.busy=null;const row=(k,v,ok)=>`<div class="unit-row"><span class="badge ${ok===true?'b-ok':ok===false?'b-err':'b-muted'}">${ok===true?'ok':ok===false?'fail':'info'}</span><b style="min-width:160px">${esc(k)}</b><span class="help" style="flex:1">${esc(typeof v==='object'?JSON.stringify(v):String(v))}</span></div>`;
   const html=`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="box"><h1>Setup check ${d.ok?'<span class="badge b-ok">all good</span>':'<span class="badge b-err">problems found</span>'}</h1>
   ${d.error?row('server',d.error,false):''}${row('Mode',d.mock?'MOCK':'live',true)}${row('OCR engine',d.ocrEngine,true)}${row('LLM engine',d.llmEngine,true)}${row('Sarvam mode',d.sarvamMode,true)}
   ${d.sarvam?row('Sarvam key',d.sarvam.key?'present':'MISSING',!!d.sarvam.key)+row('Sarvam chat ('+esc(d.sarvam.model)+')',d.sarvam.chat,!!d.sarvam.chatOk)+row('Sarvam Document AI',d.sarvam.docAi,!!d.sarvam.docAiOk)+row('Base URL',d.sarvam.base,true):''}
   ${d.tools?Object.entries(d.tools).map(([k,v])=>row('tool: '+k,v?'found':'not found',k==='tesseract'&&d.ocrEngine!=='local'?null:k.startsWith('pdf')&&d.ocrEngine==='sarvam'?null:!!v)).join(''):''}${row('Database',d.db,d.db==='connected'?true:null)}${row('Node',d.node,true)}
   ${(d.hints||[]).length?`<h2 style="margin-top:12px">What to fix</h2>${d.hints.map(h=>`<div class="issue"><span class="badge b-warn">fix</span><div>${esc(h)}</div></div>`).join('')}`:''}
   <div class="footer"><span class="help">Run again after changing .env and restarting the server.</span><button class="btn primary" onclick="this.closest('.modal').remove()">Close</button></div></div></div>`;document.body.insertAdjacentHTML('beforeend',html);},
 async changeType(code){try{const r=await api(`/batches/${S.batch.id}/doc-type`,{method:'PUT',body:{code}});S.batch.docType=r.docType;S.type=r.type;render();}catch(e){toast(e.message,true)}},
 async extract(){S.err=null;S.step=2;S.progress={log:[],message:'Starting extraction…'};render();
   try{await api(`/batches/${S.batch.id}/extract`,{method:'POST'});const pr=await UI.waitStep('extract');if(!pr)return;const full=await api(`/batches/${S.batch.id}`);S.batch=full;S.type=S.types.find(t=>t.code===S.batch.docType);S.progress=null;S.step=3;render();}
   catch(e){S.progress=null;S.err={step:'extract',message:e.message,retry:'UI.extract()'};render();}},
 editH(k,el){const f=S.type.headerFields.find(x=>x.key===k);S.batch.header[k]=isNum(f)?(el.value===''?null:Number(el.value)):el.value||null;el.classList.add('changed');},
 editL(i,k,el){const f=S.type.lineFields.find(x=>x.key===k);const l=S.batch.lines[i];l[k]=isNum(f)?(el.value===''?null:Number(el.value)):el.value||null;el.classList.add('changed');if(['qty','rate','discountAmt','taxPct'].includes(k)&&l.qty!=null&&l.rate!=null){l.amount=Math.round((l.qty*l.rate-(l.discountAmt||0))*100)/100;if(l.taxPct!=null)l.taxAmt=Math.round(l.amount*l.taxPct)/100;const tr=el.closest('tr');const idx=S.type.lineFields.filter(f=>f.key!=='lineNo').findIndex(f=>f.key==='amount');if(idx>=0){const inp=tr.querySelectorAll('input')[idx];if(inp){inp.value=l.amount;inp.classList.add('changed');}}}},
 addLine(){S.batch.lines.push({lineNo:S.batch.lines.length+1});render();},delLine(i){S.batch.lines.splice(i,1);render();},
 async saveReview(){try{busy('Saving review & suggesting master mappings…');await api(`/batches/${S.batch.id}/review`,{method:'PUT',body:{header:S.batch.header,lines:S.batch.lines}});S.batch.mapItems=await api(`/batches/${S.batch.id}/map/suggest`,{method:'POST'});S.step=4;S.busy=null;render();}catch(e){S.busy=null;render();toast(e.message,true)}},
 mapSel(id,code){const it=S.batch.mapItems.find(x=>x.id===id);it.selected=code||null;if(code){it.action='map';it.status='mapped';}render();},
 mapAct(id,a){const it=S.batch.mapItems.find(x=>x.id===id);it.action=a;if(a==='map'&&!it.selected&&it.candidates?.[0])it.selected=it.candidates[0].code;if(a!=='map')it.selected=null;it.status=a==='map'?(it.selected?'mapped':'unmatched'):a==='create'?'create':a==='skip'?'skipped':'later';render();},
 async mapSearch(id,master){const q=prompt(`Search ${master} master`);if(q==null)return;try{const rows=await api(`/masters/${master}?q=${encodeURIComponent(q)}`);const it=S.batch.mapItems.find(x=>x.id===id);it.candidates=rows.map(r=>({...r,score:0.5})).concat(it.candidates||[]).slice(0,15);if(rows[0]){it.selected=rows[0].code;it.action='map';it.status='mapped';}render();}catch(e){toast(e.message,true)}},
 async applyMap(){try{const pending=S.batch.mapItems.filter(i=>!i.action);if(pending.length&&!confirm(`${pending.length} reference(s) have no action — they will be flagged as New Master in validation. Continue?`))return;
   busy('Applying mappings & validating…');const decisions=S.batch.mapItems.filter(i=>i.action).map(i=>({id:i.id,action:i.action,selected:i.selected}));const r=await api(`/batches/${S.batch.id}/map`,{method:'PUT',body:{decisions}});Object.assign(S.batch,r);S.batch.validation=await api(`/batches/${S.batch.id}/validate`,{method:'POST'});S.step=5;S.busy=null;render();}catch(e){S.busy=null;render();toast(e.message,true)}},
 async revalidate(){try{busy('Validating…');await api(`/batches/${S.batch.id}/review`,{method:'PUT',body:{header:S.batch.header,lines:S.batch.lines}});S.batch.validation=await api(`/batches/${S.batch.id}/validate`,{method:'POST'});S.busy=null;render();}catch(e){S.busy=null;render();toast(e.message,true)}},
 async relationships(){try{busy('Looking up related documents…');const r=await api(`/batches/${S.batch.id}/relationships`);S.batch.relationshipOptions=r.options;S.batch.relationship=r.selected;S.step=6;S.busy=null;render();}catch(e){S.busy=null;render();toast(e.message,true)}},
 async setRel(mode,target,linkedDocNo){try{S.batch.relationship=await api(`/batches/${S.batch.id}/relationships`,{method:'PUT',body:{mode,target,linkedDocNo:linkedDocNo||null,autoCreate:mode==='creates'?[target]:[]}});render();}catch(e){toast(e.message,true)}},
 async reconcile(){try{busy('Reconciling totals and related documents…');S.batch.reconciliation=await api(`/batches/${S.batch.id}/reconcile`,{method:'POST'});S.step=7;S.busy=null;render();}catch(e){S.busy=null;render();toast(e.message,true)}},
 async override(key){const reason=prompt('Reason for overriding this mismatch (recorded in audit):');if(!reason)return;try{S.batch.reconciliation=await api(`/batches/${S.batch.id}/reconcile/override`,{method:'POST',body:{key,reason}});render();}catch(e){toast(e.message,true)}},
 async plan(){try{S.batch.plan=await api(`/batches/${S.batch.id}/plan`);S.step=8;render();}catch(e){toast(e.message,true)}},
 async post(approve){try{busy(approve?'Approving & posting…':'Posting…');S.batch.result=await api(`/batches/${S.batch.id}/post`,{method:'POST',body:{approve}});const full=await api(`/batches/${S.batch.id}`);S.batch=full;S.step=9;S.busy=null;render();toast(S.batch.result.status==='posted'?'Posted '+S.batch.result.createdDocNo:'Submitted for approval');}catch(e){S.busy=null;render();toast(e.message,true)}},
 async open(id){try{busy('Opening batch…');S.batch=await api(`/batches/${id}`);S.type=S.types.find(t=>t.code===S.batch.docType);S.step=Math.max(0,STEPS.indexOf(S.batch.step));if(S.batch.status==='posted')S.step=9;S.busy=null;render();}catch(e){S.busy=null;render();toast(e.message,true)}},
 async showHistory(){S.history=await api('/batches');S.step=0;S.batch=null;render();window.scrollTo(0,document.body.scrollHeight);},
 async inbox(keep){S.step=-1;$('#stepper').innerHTML='';S.batch=null;if(!keep){try{S.inbox.engine=await api('/intake/engine');S.inbox.jobs=await api('/intake');}catch(e){}}
   $('#main').innerHTML=VIEWS.INBOX();},
 ibPick(fl){S.inbox.files=[...fl];$('#main').innerHTML=VIEWS.INBOX();},ibDrop(e){e.preventDefault();UI.ibPick(e.dataTransfer.files);},
 async ibStart(){const I=S.inbox;const fd=new FormData();I.files.forEach(f=>fd.append('files',f));fd.append('split',$('#ibSplit').value);fd.append('contentType',$('#ibContent').value);fd.append('rotate',$('#ibRotate').value);
   try{I.job=await api('/intake',{method:'POST',body:fd});I.files=[];UI.ibListen();$('#main').innerHTML=VIEWS.INBOX();toast('Intake started');}catch(e){toast(e.message,true)}},
 ibListen(){const I=S.inbox;if(I.es)I.es.close();I.es=new EventSource(`${API}/intake/${I.job.id}/events`);I.es.onmessage=(m)=>{const ev=JSON.parse(m.data);if(ev.type==='snapshot')I.job=ev.job;else if(ev.type==='unit'){const i=I.job.units.findIndex(u=>u.id===ev.unit.id);if(i>=0)I.job.units[i]=ev.unit;else I.job.units.push(ev.unit);}else if(ev.type==='job'){I.job.status=ev.status;if(ev.summary)I.job.summary=ev.summary;if(ev.units)I.job.units=ev.units;if(ev.status==='done'){I.es.close();toast('Intake finished');}}
   if(S.step===-1)$('#main').innerHTML=VIEWS.INBOX();};},
 async ibRefresh(){S.inbox.job=await api(`/intake/${S.inbox.job.id}`);$('#main').innerHTML=VIEWS.INBOX();},
 async ibOpenJob(id){S.inbox.job=await api(`/intake/${id}`);S.step=-1;$('#stepper').innerHTML='';if(S.inbox.job.status!=='done')UI.ibListen();$('#main').innerHTML=VIEWS.INBOX();},
 async ibRotate(docId){const r=prompt('Rotate pages by degrees (90 / 180 / 270) and re-read:', '90');if(!r)return;try{await api(`/intake/${S.inbox.job.id}/docs/${docId}/reprocess`,{method:'POST',body:{rotate:Number(r)}});await UI.ibRefresh();}catch(e){toast(e.message,true)}},
 async ibPostClean(){if(!confirm('Post every document that passed validation & reconciliation?'))return;try{const r=await api(`/intake/${S.inbox.job.id}/post`,{method:'POST',body:{onlyClean:true}});toast(`${r.filter(x=>x.status==='posted').length} posted, ${r.filter(x=>x.skipped).length} skipped, ${r.filter(x=>x.error).length} errors`);await UI.ibRefresh();}catch(e){toast(e.message,true)}},
 async erpPreview(batchId){try{S.inbox.erp=await api(`/batches/${batchId}/erp?screen=${encodeURIComponent($('#ibScreen')?.value||'PI')}`);S.step=-1;$('#stepper').innerHTML='';$('#main').innerHTML=VIEWS.ERP();}catch(e){toast(e.message,true)}},
 erpDownload(){const e=S.inbox.erp;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(e,null,2)],{type:'application/json'}));a.download=`retailcliq-${e.header.screen}-${(e.header.invoiceNo||e.batchId.slice(0,8)).replace(/[^\w-]+/g,'_')}.json`;a.click();},
 erpCopy(){navigator.clipboard.writeText(JSON.stringify(S.inbox.erp,null,2)).then(()=>toast('Copied'));},
 erpSend(){const e=S.inbox.erp;const msg={type:'RETAILCLIQ_DOCAI_IMPORT',payload:e};if(window.opener)window.opener.postMessage(msg,'*');localStorage.setItem('retailcliq.docai.pending',JSON.stringify(msg));toast('Payload handed to the RetailCLIQ screen (postMessage + localStorage key retailcliq.docai.pending)');},
 downloadAudit(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S.batch,null,2)],{type:'application/json'}));a.download=`docai-${S.batch.id}.json`;a.click();},
};
